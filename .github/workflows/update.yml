name: Mise à jour PronostiK

on:
  schedule:
    - cron: '7,37 * * * *'      # toutes les 30 minutes (résultats et pronostics à jour)
  workflow_dispatch:             # bouton « Run workflow »
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pronostik
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mettre à jour les données
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: node scripts/update.mjs
      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "pronostik-bot"
          git config user.email "pronostik-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données"
            # Panne passagère de GitHub ou conflit : 4 essais espacés, sinon les données repartent au passage suivant (pas d'alerte inutile).
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              echo "Envoi impossible (essai $i), nouvel essai dans 15 s"; sleep 15
            done
            echo "::warning::Envoi des données reporté au prochain passage"
          fi

  deploy:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html style.css app.js manifest.webmanifest _site/
          cp -r assets _site/
          # numéro de version : force le rechargement du code (application sur l'écran d'accueil comprise)
          V=$(cat index.html style.css app.js | sha1sum | cut -c1-10)
          sed -i "s/content=\"dev\"/content=\"$V\"/; s/style.css?v=dev/style.css?v=$V/; s/app.js?v=dev/app.js?v=$V/" _site/index.html
          printf '{"v":"%s"}' "$V" > _site/version.json
          mkdir _site/data
          cp data/predictions.json data/meta.json data/scorecard.json _site/data/
          if [ -f data/standings.json ]; then cp data/standings.json _site/data/; fi
          if [ -f data/resume.json ]; then cp data/resume.json _site/data/; fi
          if [ -f data/chat.json ]; then cp data/chat.json _site/data/; fi
          if [ -d .well-known ]; then cp -r .well-known _site/; fi
          if [ -d downloads ]; then cp -r downloads _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Publication bloquée par une publication précédente restée « en cours » : on l'annule puis on republie.
      - name: Débloquer la publication si besoin
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $( (git log -n 40 --format=%H; gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=20" --jq '.[].sha') | sort -u); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "publication $sha annulée" || true
          done
          sleep 15
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
