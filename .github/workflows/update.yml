name: Mise à jour PronostiK

on:
  schedule:
    - cron: '17 */3 * * *'      # toutes les 3 heures
  workflow_dispatch:             # bouton « Run workflow »
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pronostik
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mettre à jour les données
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: node scripts/update.mjs
      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "pronostik-bot"
          git config user.email "pronostik-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données"
            git pull --rebase
            git push
          fi

  deploy:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html style.css app.js manifest.webmanifest _site/
          cp -r assets _site/
          # numéro de version : force le rechargement du code (application sur l'écran d'accueil comprise)
          V=$(git rev-parse --short HEAD)
          sed -i "s/content=\"dev\"/content=\"$V\"/; s/style.css?v=dev/style.css?v=$V/; s/app.js?v=dev/app.js?v=$V/" _site/index.html
          printf '{"v":"%s"}' "$V" > _site/version.json
          mkdir _site/data
          cp data/predictions.json data/meta.json data/scorecard.json _site/data/
          if [ -f data/standings.json ]; then cp data/standings.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
