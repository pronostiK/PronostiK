name: Laboratoire xG

on:
  push:
    branches: [main]
    paths: ['scripts/lab-xg.mjs', 'scripts/lab-markets.mjs', '.github/workflows/lab.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronostik-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lancer l'expérience
        run: node scripts/lab-markets.mjs
      - name: Enregistrer le résultat
        if: always()
        run: |
          git config user.name "pronostik-bot"
          git config user.email "pronostik-bot@users.noreply.github.com"
          git add lab
          if ! git diff --cached --quiet; then
            git commit -m "Résultats du laboratoire xG"
            git pull --rebase -X theirs || { git rebase --abort; echo "Conflit : nouvel essai au prochain passage"; exit 0; }
            git push
          fi
