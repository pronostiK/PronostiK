name: lab-logo
on:
  push:
    paths: ['.github/workflows/lab-logo.yml']
# retry 5
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch crest
        run: |
          mkdir -p lab/logos
          U=$(python3 - <<'PY'
          import json,urllib.request,urllib.parse
          H={'User-Agent':'PronostiK-lab/1.0'}
          def g(q):
              return json.load(urllib.request.urlopen(urllib.request.Request('https://en.wikipedia.org/w/api.php?'+urllib.parse.urlencode(q),headers=H)))
          r=g({'action':'query','titles':'ŠK Slovan Bratislava','prop':'pageimages','piprop':'thumbnail|name','pithumbsize':'400','redirects':1,'format':'json'})
          pg=list(r['query']['pages'].values())[0]
          print(pg['thumbnail']['source'])
          PY
          )
          echo "$U"
          curl -sL -A "PronostiK-lab/1.0" "$U" -o lab/logos/slovan.png
          ls -la lab/logos
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add lab/logos; git commit -m "lab: Slovan crest v2" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
