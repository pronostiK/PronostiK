name: lab-logo
on:
  push:
    paths: ['.github/workflows/lab-logo.yml']
# retry 2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sabah crest
        run: |
          mkdir -p lab/logos
          U=$(curl -s -A "PronostiK-lab/1.0" "https://en.wikipedia.org/wiki/Sabah_FK_(Azerbaijan)" | grep -oE '//upload\.wikimedia\.org/[^" ]+\.(png|svg\.png|jpg)' | grep -i sabah | head -1)
          U="https:${U}"
          U=$(echo "$U" | sed -E 's#/thumb(/.*)/[0-9]+px-[^/]+$#\1#')
          echo "$U"
          curl -sL -A "PronostiK-lab/1.0" "$U" -o "lab/logos/sabah.${U##*.}"
          ls -la lab/logos
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add lab/logos; git commit -m "lab: Sabah crest" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
