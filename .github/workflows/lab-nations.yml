name: Laboratoire équipes nationales

on:
  push:
    branches: [main]
    paths: ['scripts/lab-nations*.mjs', '.github/workflows/lab-nations.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronostik-lab-nations
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sonder la source
        run: node scripts/lab-nations-fx.mjs
      - name: Enregistrer le résultat
        if: always()
        run: |
          git config user.name "pronostik-bot"
          git config user.email "pronostik-bot@users.noreply.github.com"
          git add lab/nations
          if ! git diff --cached --quiet; then
            git commit -m "Laboratoire équipes nationales : données"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
