name: Étude absences (branche expérimentale)

on:
  push:
    branches: [experience-absences]
    paths: ['scripts/probe-apifootball.mjs', 'scripts/absences-*.mjs', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronostik-absences
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sonder API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/absences-probe2.mjs
      - name: Enregistrer le résultat (branche expérimentale uniquement)
        if: always()
        run: |
          git config user.name "pronostik-bot"
          git config user.email "pronostik-bot@users.noreply.github.com"
          git add lab
          if ! git diff --cached --quiet; then
            git commit -m "Étude absences : résultat de la sonde"
            git pull --rebase origin experience-absences
            git push origin HEAD:experience-absences
          fi
